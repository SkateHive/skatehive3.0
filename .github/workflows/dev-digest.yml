name: Dev Digest

# Weekly "Dev Update" digest of the last 7 days of commits.
# DRY RUN: nothing is broadcast to Hive — the digest is only published as a
# step summary + artifact. No secrets are referenced.

# Least privilege: the job only reads the repo (artifact upload uses the
# runner's own token, not GITHUB_TOKEN).
permissions:
  contents: read

on:
  schedule:
    - cron: "0 18 * * 5" # Fridays, 18:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Days to look back"
        type: string
        default: "7"

jobs:
  digest:
    name: Generate digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for `git log`
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate digest
        # shell: bash adds -o pipefail. Without it the default `bash -e` lets a
        # crashed script exit 0 through tee, leaving an empty digest that reads
        # as a quiet week instead of a failure.
        shell: bash
        # Empty on scheduled runs; the script falls back to its 7-day default.
        env:
          DIGEST_DAYS: ${{ github.event.inputs.days }}
        run: |
          echo "DIGEST_WINDOW=$(pnpm tsx scripts/dev-digest/generateDigest.ts --print-days)" >> "$GITHUB_ENV"
          pnpm tsx scripts/dev-digest/generateDigest.ts | tee digest.md
          # Nothing to publish: drop the file so no empty artifact is uploaded.
          [ -s digest.md ] || rm -f digest.md

      - name: Publish to run summary
        shell: bash
        run: |
          if [ -s digest.md ]; then
            cat digest.md >> "$GITHUB_STEP_SUMMARY"
          else
            # DIGEST_WINDOW is the normalized window the script actually used,
            # so the note can never disagree with the digest.
            echo "No qualifying commits in the last $DIGEST_WINDOW days — digest skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dev-digest
          path: digest.md
          if-no-files-found: ignore
